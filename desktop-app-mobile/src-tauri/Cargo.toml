[package]
name = "fimto-concrete-app"
version = "1.8.0"
description = "Fimto Concrete ERP — Windows desktop wrapper (Tauri) around website-app"
authors = ["FIMTO Software"]
license = "MIT"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-store = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
