name: Desktop installers (Windows + Linux + macOS)

on:
  workflow_dispatch:
  push:
    tags: ["desktop-v*"]

jobs:
  build:
    permissions:
      contents: write # tauri-action creates the draft Release + uploads installers
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            bundles: nsis
            extra-target: ""
          - os: ubuntu-22.04
            bundles: deb,appimage
            extra-target: ""
          - os: macos-latest
            bundles: dmg
            extra-target: "--target universal-apple-darwin"

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Linux deps
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ startsWith(matrix.os, 'macos') && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Install frontend deps
        # `npm ci` on purpose: the root postinstall applies the mobile
        # patch-package patches and links Tailwind v3 into NativeWind. Skipping
        # install scripts (`--ignore-scripts`) left the mobile app unpatched and
        # the `expo export --platform web` step of the App flavour failed on
        # every runner.
        run: npm ci --no-audit --no-fund

      - name: Build installers (Tauri)
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VITE_API_URL: ${{ vars.VITE_API_URL }}
        with:
          projectPath: desktop-app-exe/src-tauri
          tagName: desktop-v__VERSION__
          releaseName: "Fimto Concrete Desktop v__VERSION__"
          releaseBody: "ERP desktop (setup.exe · AppImage/deb · dmg) + App field flavor"
          releaseDraft: true
          prerelease: false
          args: "--bundles ${{ matrix.bundles }} ${{ matrix.extra-target }}"

      - name: Build app-flavor installers (Tauri, mobile UI)
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VITE_API_URL: ${{ vars.VITE_API_URL }}
        with:
          projectPath: desktop-app-mobile/src-tauri
          tagName: desktop-v__VERSION__
          releaseName: "Fimto Concrete Desktop v__VERSION__"
          releaseBody: "ERP desktop (setup.exe · AppImage/deb · dmg) + App field flavor"
          releaseDraft: true
          prerelease: false
          args: "--bundles ${{ matrix.bundles }} ${{ matrix.extra-target }}"
