# Tenant recovery snapshots — scheduled trigger (free, no extra infra)
#
# Render's free tier does not allow cron-type services, so the schedule lives
# here instead: every 6 hours GitHub Actions calls the live cron endpoint,
# which snapshots all tenants (worst-case loss ≈ 6h). The endpoint does all
# the work; this workflow only triggers it and fails loudly on non-200.
#
# Setup (once): GitHub repo → Settings → Secrets and variables → Actions →
#   New repository secret:  RECOVERY_CRON_SECRET = <same value as the API's
#   CRON_SECRET env var on Render>.
# Manual test: Actions tab → "Tenant recovery snapshots" → Run workflow.

name: Tenant recovery snapshots

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch: {}

permissions:
  contents: none

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Trigger all-tenant snapshot
        run: |
          code=$(curl -s -o /tmp/recovery.json -w "%{http_code}" -m 150 \
            "https://concrete.fimtosoft.com/api/cron/recovery-backup" \
            -H "Authorization: Bearer ${{ secrets.RECOVERY_CRON_SECRET }}")
          head -c 400 /tmp/recovery.json; echo
          test "$code" = "200"
