name: Fimto CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  static-checks:
    runs-on: ubuntu-latest
    # The full chain (install → 11 audits → typecheck of 3 workspaces → Vite
    # build → Next build) needs more than the 20 minutes the job used to allow
    # on a cold runner.
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Secret scan
        run: npm run security:audit
      - name: Firestore rules static audit
        run: npm run security:rules
      - name: Tenant-isolation static audit
        run: npm run security:tenancy
      - name: Legacy API production guard
        run: npm run security:legacy
      - name: ZATCA validation smoke
        run: npm run test:zatca
      - name: Security unit smoke
        run: npm run test:security
      - name: ZATCA static audit
        run: npm run security:zatca
      - name: Tenant route review report
        run: npm run security:tenant-report
      - name: Mobile release config audit
        run: npm run security:mobile
      - name: APK integrity audit
        run: npm run security:apk
      - name: Typecheck all workspaces
        run: npm run typecheck:all
      - name: Build active website
        run: npm run build:site
      - name: Build Next API and legacy boundary
        run: npm run build
      - name: Dependency audit report
        continue-on-error: true
        run: npm run security:audit:deps
