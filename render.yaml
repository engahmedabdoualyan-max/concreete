# Fimto Concrete ERP — free backend deployment (Render blueprint)
#
# Why Render and not Vercel Hobby: the API is one Next.js app with 151 routes.
# Vercel counts each route as a serverless function and Hobby allows 12, so the
# build is rejected. Render runs it as a single process, so the free tier is
# enough (it sleeps after inactivity and wakes on the first request).
#
# Why a downloaded bundle instead of a build: the free instance has 512 MB of
# RAM, and `next build` for this app peaks near 1 GB, so the container kills the
# build. The server is therefore built on a full-RAM machine and uploaded as a
# GitHub Release asset; the service only downloads, unpacks and runs it. The
# runtime fits comfortably in 512 MB. Rebuild and republish with:
#     bash ~/.local/bin/fimto-publish-api
# then press "Manual sync" on the blueprint.
#
# Steps (no card needed on the free plan):
#   1. Dashboard → Blueprints → New Blueprint Instance → pick this repo → apply.
#   2. Render asks for one value only: DATABASE_URL (the Supabase pooler URL,
#      port 6543, IPv4). The three secrets below are generated by Render.
#   3. The API lives at https://fimto-api-web.onrender.com
#
# Afterwards the URL is published to fimto-api-url.txt on the website, which the
# desktop app reads at start-up, so no app rebuild is needed.
#
# NOTE on the name: this service is fimto-api-web, not fimto-api, because
# "fimto-api" is already taken in this workspace by an unused Key Value
# (Redis/Valkey) instance. The app does not use Redis.

services:
  - type: web
    name: fimto-api-web
    runtime: node
    plan: free
    region: singapore
    branch: main
    rootDir: .
    buildCommand: >-
      mkdir -p api-run &&
      curl -fsSL
      https://github.com/engahmedabdoualyan-max/concreete/releases/download/api/fimto-api.tgz
      | tar -xz -C api-run &&
      test -f api-run/server.js
    startCommand: node api-run/server.js
    healthCheckPath: /api/health
    autoDeploy: false
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: HOSTNAME
        value: 0.0.0.0
      # Fill these in the Render dashboard (marked secret):
      #   DATABASE_URL        postgresql://USER:PASSWORD@aws-0-ap-southeast-2.pooler.supabase.com:6543/postgres
      #   JWT_SECRET          openssl rand -hex 32
      #   JWT_REFRESH_SECRET  openssl rand -hex 32
      #   QR_SECRET           openssl rand -hex 32
      - key: DATABASE_URL
        # Supabase pooler, port 6543, IPv4 (NOT the direct connection)
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: QR_SECRET
        generateValue: true
